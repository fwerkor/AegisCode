name: Feature request
description: Suggest an AegisCode improvement
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or workflow problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior, CLI/API shape, and expected user experience.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI
        - Tools and guardrails
        - Approvals
        - Snapshots
        - Subagents
        - Providers and auth
        - WebUI
        - Packaging and install
        - CI and release
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Governance and safety impact
      description: Explain whether this affects shell execution, file access, approvals, snapshots, credentials, or release publishing.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
