name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .[dev]
      - run: python -m pytest -q

  docs-link-check:
    name: docs link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_docs.py

  install-method-smoke:
    name: install smoke (${{ matrix.method }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        method: [pipx, uv-tool, npm-wrapper]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: matrix.method == 'npm-wrapper'
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v5
        if: matrix.method == 'uv-tool'
      - run: python -m pip install --upgrade pip
      - name: pipx smoke
        if: matrix.method == 'pipx'
        run: |
          python -m pip install pipx
          PIPX_HOME=/tmp/pipx PIPX_BIN_DIR=/tmp/pipx/bin python -m pipx install .
          /tmp/pipx/bin/aegiscode doctor
      - name: uv tool smoke
        if: matrix.method == 'uv-tool'
        run: |
          uv tool install .
          ~/.local/bin/aegiscode doctor
      - name: npm wrapper smoke
        if: matrix.method == 'npm-wrapper'
        run: |
          python -m pip install -e .
          npm install -g ./packaging/npm-wrapper
          aegiscode doctor

  release-dry-run:
    name: release dry-run and manifest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e .[dev]
      - run: python scripts/validate_packaging.py
      - run: python scripts/release_dry_run.py

  docker-smoke:
    name: Docker smoke run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: aegiscode:ci
      - run: docker run --rm aegiscode:ci doctor

  binary-smoke:
    name: binary smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: dist/aegiscode
          - os: macos-latest
            binary: dist/aegiscode
          - os: windows-latest
            binary: dist/aegiscode.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pyinstaller
      - run: python -m pip install -e .
      - run: python scripts/build_binary.py
      - shell: bash
        run: |
          "${{ matrix.binary }}" doctor
      - uses: actions/upload-artifact@v4
        with:
          name: aegiscode-binary-${{ matrix.os }}
          path: dist/aegiscode*

  tool-surface-snapshot:
    name: tool surface snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e .[dev]
      - run: python -m pytest tests/test_docs_and_packaging.py::test_tool_surface_snapshot -q
