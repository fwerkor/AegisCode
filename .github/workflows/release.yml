name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version/tag, for example v0.2.0 or v0.2.0-rc.1'
        required: true
        type: string
      prerelease:
        description: 'Mark the GitHub Release as a pre-release'
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  packages: write

env:
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  RELEASE_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || contains(github.ref_name, '-') }}

jobs:
  package:
    name: Python package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_release_version.py "$RELEASE_VERSION"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: dist/*

  binaries:
    name: standalone binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: aegiscode-linux-x86_64
            source: dist/aegiscode
          - os: macos-latest
            artifact: aegiscode-macos-x86_64
            source: dist/aegiscode
          - os: windows-latest
            artifact: aegiscode-windows-x86_64.exe
            source: dist/aegiscode.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_release_version.py "$RELEASE_VERSION"
      - run: python -m pip install --upgrade pip pyinstaller
      - run: python -m pip install -e .
      - run: python scripts/build_binary.py
      - shell: bash
        run: |
          mkdir -p release-bin
          cp "${{ matrix.source }}" "release-bin/${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-bin/${{ matrix.artifact }}

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Prepare Docker tags
        id: docker-tags
        shell: bash
        run: |
          tags="ghcr.io/fwerkor/aegiscode:${RELEASE_VERSION}"
          if [ "${RELEASE_PRERELEASE}" != "true" ]; then
            tags="$tags,ghcr.io/fwerkor/aegiscode:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          push: true
          tags: ${{ steps.docker-tags.outputs.tags }}

  release:
    name: Upload GitHub Release artifacts
    runs-on: ubuntu-latest
    needs: [package, binaries, docker]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: python-packages
          path: release-artifacts
      - uses: actions/download-artifact@v4
        with:
          pattern: aegiscode-*
          path: release-artifacts
          merge-multiple: true
      - name: Render checksums and package manifests
        run: python scripts/render_release_manifests.py --version "$RELEASE_VERSION" --artifacts release-artifacts --out release-artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ env.RELEASE_PRERELEASE }}
          files: release-artifacts/**/*
          generate_release_notes: true
