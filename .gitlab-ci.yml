stages:
  - test
  - package

unit-test:
  stage: test
  image: python:3.12-slim
  script:
    - python -m pip install --upgrade pip
    - pip install -e .[dev]
    - make test

container-build:
  stage: package
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -t aegiscode:ci .
  rules:
    - if: $CI_COMMIT_BRANCH
